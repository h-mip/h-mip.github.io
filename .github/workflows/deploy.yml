# Builds the site with Hugo and publishes it to GitHub Pages (h-mip.com) on
# every push to main. Can also be run by hand from the repository's Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the version this site was last tested with; see README.md before changing
      HUGO_VERSION: 0.155.3
    steps:
      - name: Install Hugo
        run: |
          wget -nv -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build
        run: hugo --gc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
