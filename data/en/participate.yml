################################# Service #################################
participate:
  enable : true
  title : Participate
  content: "H-MIP ended on 30 September 2026 and is no longer recruiting volunteers. Thank you to everyone who took part. You can keep helping mosquito research by reporting mosquitoes and bites with Mosquito Alert, which continues."
  main_button_url: participate
  main_button_text: "Learn More"
  service_item :
    # service item loop
    - name : "[Mosquito Alert](#mosquito_alert)"
      icon : "fas fa-people-arrows"
      url: http://www.mosquitoalert.com
      content : "Report mosquitoes through the Mosquito Alert app."
      
    # service item loop
    - name : "[Talk to us](#talk)"
      icon : "fas fa-comments"
      url: participate#talk
      content : "We talked to people about their experiences with mosquitoes."
      
    # service item loop
    - name : "[Show us](#show)"
      icon : "fas fa-walking"
      url: participate#show
      content : "We invited volunteers to let us accompany them during their routines."
      
    # service item loop
    - name : "[Share mosquitoes](#share_mosquitoes)"
      icon : "fas fa-binoculars" # themify icon pack : https://themify.me/themify-icons
      url: participate#share_mosquitoes
      content : "We invited volunteers to let us collect mosquitoes where they spend time."
      
    # service item loop
    - name : "[Share tracks](#share_tracks)"
      icon : "fas fa-mobile-alt"
      url: participate#share_tracks
      content : "We improved Space Mapper, a privacy-focused mobility app."
      
    # service item loop
    - name : "[Share DNA](#share_dna)"
      icon : "fas fa-dna"
      url: participate#share_dna
      content : "Volunteers gave saliva samples to compare with the human blood in mosquitoes."

  content_detail : "H-MIP ended on 30 September 2026 and is no longer recruiting volunteers. Thank you to everyone who took part. You can keep helping mosquito research by reporting mosquitoes and bites with Mosquito Alert, which continues."

  service_item_detail :
    # service item loop
    - name : "Mosquito Alert"
      id : mosquito_alert
      icon : "fas fa-people-arrows"
      image: images/participate/malert.png
      image_webp: images/participate/malert.webp
      content : "Mosquito Alert continues after H-MIP. Download the app to report mosquitoes, their breeding sites and where you are bitten."
      button : true
      button_text : "Go to Mosquito Alert now"
      button_url: http://www.mosquitoalert.com
      
    # service item loop
    - name : "Talk to us"
      id: talk
      icon : "fas fa-comments"
      image: images/participate/talk_to_us.jpg
      image_webp: images/participate/talk_to_us.webp
      content : "We interviewed people about their experiences with mosquitoes — in the street, in person, or by phone or video call — asking where and when they were bitten and how often."

      
    # service item loop
    - name : "Show us"
      id: show
      icon : "fas fa-walking"
      image: images/participate/walking.jpg
      image_webp: images/participate/walking.webp
      content : "We invited volunteers to let us accompany them during their usual routines, to observe their encounters with mosquitoes."
      
    # service item loop
    - name : Share mosquitoes
      id: share_mosquitoes
      icon : "fas fa-binoculars" # themify icon pack : https://themify.me/themify-icons
      image: images/participate/mosquits.jpg
      image_webp: images/participate/mosquits.webp
      content : "We invited volunteers to let us collect mosquitoes in and around their homes, gardens and other places where they spend time."
      
    # service item loop
    - name : Share tracks
      id: share_tracks
      icon : "fas fa-mobile-alt"
      image: images/participate/tracks.png
      image_webp: images/participate/tracks.webp
      content : "We improved Space Mapper, an open-source, privacy-focused app for research on human mobility that uses end-to-end encryption and lets participants control what they share."
      button: true
      button_url: https://github.com/ActivitySpaceLab/space_mapper
      button_text: "Learn more about Space Mapper"
      
    # service item loop
    - name : Share DNA
      id: share_dna
      icon : "fas fa-dna"
      image: images/participate/dna.png
      image_webp: images/participate/dna.webp
      content : "Volunteers gave saliva samples, for example at outdoor events, so that we could compare their DNA with the human blood found in mosquitoes."
      button: true
      button_text: "Learn more about DNA collection"
      button_url: http://www.mosquitoalert.com/en/reconstruyendo-la-interaccion-humano-mosquito-en-el-jardin-botanico-marimurtra/