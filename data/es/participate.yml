################################# Service #################################
participate:
  enable : true
  title : Participa
  content: "El H-MIP terminó el 30 de septiembre de 2026 y ya no recluta voluntarios. Gracias a todas las personas que han participado. Puedes seguir ayudando a la investigación sobre mosquitos avisando de los mosquitos y las picaduras con Mosquito Alert, que sigue en marcha."
  main_button_url: participate
  main_button_text: "Aprende más"
  service_item :
    # service item loop
    - name : "[Mosquito Alert](#mosquito_alert)"
      icon : "fas fa-people-arrows"
      url: http://www.mosquitoalert.com
      content : "Informa de los mosquitos que veas con la aplicación Mosquito Alert."
      
    # service item loop
    - name : "[Hablemos](#talk)"
      icon : "fas fa-comments"
      url: participate#talk
      content : "Hablamos con la gente sobre sus experiencias con los mosquitos."
      
    # service item loop
    - name : "[Enséñanos](#show)"
      icon : "fas fa-walking"
      url: participate#show
      content : "Invitamos a voluntarios a dejarnos acompañarlos en sus rutinas."
      
    # service item loop
    - name : "[Capturamos mosquitos](#share_mosquitoes)"
      icon : "fas fa-binoculars" # themify icon pack : https://themify.me/themify-icons
      url: participate#share_mosquitoes
      content : "Invitamos a voluntarios a dejarnos capturar mosquitos donde pasan el tiempo."
      
    # service item loop
    - name : "[Comparte tu movilidad](#share_tracks)"
      icon : "fas fa-mobile-alt"
      url: participate#share_tracks
      content : "Mejoramos Space Mapper, una aplicación de movilidad centrada en la privacidad."
      
    # service item loop
    - name : "[Comparte ADN](#share_dna)"
      icon : "fas fa-dna"
      url: participate#share_dna
      content : "Los voluntarios dieron muestras de saliva para compararlas con la sangre humana de los mosquitos."

  content_detail : "El H-MIP terminó el 30 de septiembre de 2026 y ya no recluta voluntarios. Gracias a todas las personas que han participado. Puedes seguir ayudando a la investigación sobre mosquitos avisando de los mosquitos y las picaduras con Mosquito Alert, que sigue en marcha."
  main_download_button : "Ir a Mosquito Alert"
  main_download_button_url: "https://www.mosquitoalert.com"
  service_item_detail :
    # service item loop
    - name : "Mosquito Alert"
      id : mosquito_alert
      icon : "fas fa-people-arrows"
      image: images/participate/malert.png
      image_webp: images/participate/malert.webp
      content : "Mosquito Alert sigue después del H-MIP. Bájate la aplicación para avisar de los mosquitos, sus sitios de cría y dónde te han picado."
      button : true
      button_text : "Participa con Mosquito Alert"
      button_url: http://www.mosquitoalert.com
      
    # service item loop
    - name : "Hablemos"
      id: talk
      icon : "fas fa-comments"
      image: images/participate/talk_to_us.jpg
      image_webp: images/participate/talk_to_us.webp
      content : "Entrevistamos a personas sobre sus experiencias con los mosquitos —en la calle, en persona o por teléfono o videollamada— y les preguntamos dónde y cuándo les picaban y con qué frecuencia."

      
    # service item loop
    - name : "Enséñanos"
      id: show
      icon : "fas fa-walking"
      image: images/participate/walking.jpg
      image_webp: images/participate/walking.webp
      content : "Invitamos a voluntarios a dejarnos acompañarlos durante sus rutinas habituales para observar sus interacciones con los mosquitos."
      
    # service item loop
    - name : "Capturamos mosquitos"
      id: share_mosquitoes
      icon : "fas fa-binoculars" # themify icon pack : https://themify.me/themify-icons
      image: images/participate/mosquits.jpg
      image_webp: images/participate/mosquits.webp
      content : "Invitamos a voluntarios a dejarnos capturar mosquitos en su casa y alrededores, en su jardín y en otros lugares donde pasan el tiempo."
      
    # service item loop
    - name : "Comparte tu movilidad"
      id: share_tracks
      icon : "fas fa-mobile-alt"
      image: images/participate/tracks.png
      image_webp: images/participate/tracks.webp
      content : "Mejoramos Space Mapper, una aplicación de código abierto centrada en la privacidad para la investigación sobre la movilidad humana, que utiliza cifrado de extremo a extremo y permite a los participantes controlar qué comparten."
      button: true
      button_url: https://github.com/ActivitySpaceLab/space_mapper
      button_text: "Más información sobre Space Mapper"
      
    # service item loop
    - name : "Comparte ADN"
      id: share_dna
      icon : "fas fa-dna"
      image: images/participate/dna.png
      image_webp: images/participate/dna.webp
      content : "Los voluntarios dieron muestras de saliva, por ejemplo en actividades al aire libre, para que pudiéramos comparar su ADN con la sangre humana encontrada en los mosquitos."
      button: true
      button_text: "Más información sobre la recogida de ADN"
      button_url: http://www.mosquitoalert.com/en/reconstruyendo-la-interaccion-humano-mosquito-en-el-jardin-botanico-marimurtra/
