################################# Service #################################
participate:
  enable : true
  title : Participa
  content: "L'H-MIP va acabar el 30 de setembre de 2026 i ja no recluta voluntaris. Gràcies a totes les persones que hi han participat. Pots continuar ajudant la recerca sobre mosquits avisant dels mosquits i de les picades amb Mosquito Alert, que continua en marxa."
  main_button_url: participate
  main_button_text: "Aprèn més"
  service_item :
    # service item loop
    - name : "[Mosquito Alert](#mosquito_alert)"
      icon : "fas fa-people-arrows"
      url: http://www.mosquitoalert.com
      content : "Informa dels mosquits que vegis amb l'aplicació Mosquito Alert."
      
    # service item loop
    - name : "[Parlem](#talk)"
      icon : "fas fa-comments"
      url: participate#talk
      content : "Vam parlar amb la gent sobre les seves experiències amb els mosquits."
      
    # service item loop
    - name : "[Ensenya'ns](#show)"
      icon : "fas fa-walking"
      url: participate#show
      content : "Vam convidar voluntaris a deixar-nos acompanyar-los en les seves rutines."
      
    # service item loop
    - name : "[Capturem mosquits](#share_mosquitoes)"
      icon : "fas fa-binoculars" # themify icon pack : https://themify.me/themify-icons
      url: participate#share_mosquitoes
      content : "Vam convidar voluntaris a deixar-nos capturar mosquits on passen el temps."
      
    # service item loop
    - name : "[Comparteix la teva mobilitat](#share_tracks)"
      icon : "fas fa-mobile-alt"
      url: participate#share_tracks
      content : "Vam millorar Space Mapper, una aplicació de mobilitat centrada en la privadesa."
      
    # service item loop
    - name : "[Comparteix ADN](#share_dna)"
      icon : "fas fa-dna"
      url: participate#share_dna
      content : "Els voluntaris van donar mostres de saliva per comparar-les amb la sang humana dels mosquits."

  content_detail : "L'H-MIP va acabar el 30 de setembre de 2026 i ja no recluta voluntaris. Gràcies a totes les persones que hi han participat. Pots continuar ajudant la recerca sobre mosquits avisant dels mosquits i de les picades amb Mosquito Alert, que continua en marxa."
  service_item_detail :
    # service item loop
    - name : "Mosquito Alert"
      id : mosquito_alert
      icon : "fas fa-people-arrows"
      image: images/participate/malert.png
      image_webp: images/participate/malert.webp
      content : "Mosquito Alert continua després de l'H-MIP. Baixa't l'aplicació per avisar dels mosquits, dels seus llocs de cria i d'on t'han picat."
      button : true
      button_text : "Participa amb Mosquito Alert"
      button_url: http://www.mosquitoalert.com
      
    # service item loop
    - name : "Parlem"
      id: talk
      icon : "fas fa-comments"
      image: images/participate/talk_to_us.jpg
      image_webp: images/participate/talk_to_us.webp
      content : "Vam entrevistar persones sobre les seves experiències amb els mosquits —al carrer, en persona o per telèfon o videotrucada— i els vam preguntar on i quan els picaven i amb quina freqüència."

      
    # service item loop
    - name : "Ensenya'ns"
      id: show
      icon : "fas fa-walking"
      image: images/participate/walking.jpg
      image_webp: images/participate/walking.webp
      content : "Vam convidar voluntaris a deixar-nos acompanyar-los durant les seves rutines habituals per observar les seves interaccions amb els mosquits."
      
    # service item loop
    - name : "Captura mosquits"
      id: share_mosquitoes
      icon : "fas fa-binoculars" # themify icon pack : https://themify.me/themify-icons
      image: images/participate/mosquits.jpg
      image_webp: images/participate/mosquits.webp
      content : "Vam convidar voluntaris a deixar-nos capturar mosquits a casa seva i als voltants, al jardí i en altres llocs on passen el temps."
      
    # service item loop
    - name : "Comparteix la teva mobilitat"
      id: share_tracks
      icon : "fas fa-mobile-alt"
      image: images/participate/tracks.png
      image_webp: images/participate/tracks.webp
      content : "Vam millorar Space Mapper, una aplicació de codi obert centrada en la privadesa per a la recerca sobre la mobilitat humana, que utilitza el xifratge d'extrem a extrem i permet als participants controlar què comparteixen."
      button: true
      button_url: https://github.com/ActivitySpaceLab/space_mapper
      button_text: "Més informació sobre Space Mapper"
      
    # service item loop
    - name : "Comparteix ADN"
      id: share_dna
      icon : "fas fa-dna"
      image: images/participate/dna.png
      image_webp: images/participate/dna.webp
      content : "Els voluntaris van donar mostres de saliva, per exemple en activitats a l'aire lliure, perquè poguéssim comparar el seu ADN amb la sang humana trobada als mosquits."
      button: true
      button_text: "Més informació sobre la recollida d'ADN"
      button_url: http://www.mosquitoalert.com/en/reconstruyendo-la-interaccion-humano-mosquito-en-el-jardin-botanico-marimurtra/
