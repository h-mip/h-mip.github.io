############################### Participate Detail ################################
participate_detail:
  title : "Participa en H-MIP"
  content: "L'H-MIP va acabar el 30 de setembre de 2026 i ja no recluta voluntaris. Gràcies a totes les persones que hi han participat. Pots continuar ajudant la recerca sobre mosquits avisant dels mosquits i de les picades amb Mosquito Alert, que continua en marxa."
  service_item :
    # service item loop
    - name : "Mosquito Alert"
      id : mosquito_alert
      icon : "fas fa-people-arrows"
      content : "Mosquito Alert continua després de l'H-MIP. Baixa't l'aplicació per avisar dels mosquits, dels seus llocs de cria i d'on t'han picat."
      button : true
      button_text : "Participa amb Mosquito Alert"
      button_url: http://www.mosquitoalert.com
      
    # service item loop
    - name : "Parlem"
      id: talk
      icon : "fas fa-comments"
      content : "Vam entrevistar persones sobre les seves experiències amb els mosquits —al carrer, en persona o per telèfon o videotrucada— i els vam preguntar on i quan els picaven i amb quina freqüència."

      
    # service item loop
    - name : "Ensenya'ns"
      id: show
      icon : "fas fa-walking"
      content : "Vam convidar voluntaris a deixar-nos acompanyar-los durant les seves rutines habituals per observar les seves interaccions amb els mosquits."
      
    # service item loop
    - name : "Captura mosquits"
      id: share_mosquitoes
      icon : "fas fa-binoculars" # themify icon pack : https://themify.me/themify-icons
      content : "Vam convidar voluntaris a deixar-nos capturar mosquits a casa seva i als voltants, al jardí i en altres llocs on passen el temps."
      
    # service item loop
    - name : "Comparteix la teva mobilitat"
      id: share_tracks
      icon : "fas fa-mobile-alt"
      content : "Vam millorar Space Mapper, una aplicació de codi obert centrada en la privadesa per a la recerca sobre la mobilitat humana, que utilitza el xifratge d'extrem a extrem i permet als participants controlar què comparteixen."
      button: true
      button_url: https://github.com/ActivitySpaceLab/space_mapper
      button_text: "Més informació sobre Space Mapper"
      
    # service item loop
    - name : "Comparteix ADN"
      id: share_dna
      icon : "fas fa-dna"
      content : "Els voluntaris van donar mostres de saliva, per exemple en activitats a l'aire lliure, perquè poguéssim comparar el seu ADN amb la sang humana trobada als mosquits."
      button_text: "Més informació sobre la recollida d'ADN"
      button_url: http://www.mosquitoalert.com/en/reconstruyendo-la-interaccion-humano-mosquito-en-el-jardin-botanico-marimurtra/
