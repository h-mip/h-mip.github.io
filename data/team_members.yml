# Team members, shown in this order in all three languages. The section title
# and on/off switch are in data/<lang>/team.yml.
#
# name         shown as written
# image        photo in assets/images/team/ (any size; it is cropped square and
#              resized at build time). Leave it out for someone who prefers no
#              photo: their initials are shown instead.
# initials     optional; overrides the initials shown when there is no photo
# designation  role; either one text for all languages or ca/es/en versions
# content      position and institution; same rules as designation
# social       profile links: icon is a themify (ti-...) or Font Awesome
#              (fab fa-...) class

